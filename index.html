<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer - Neumorphic UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: #E0E5EC;
            color: #2D3748;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .main-card {
            width: 100%;
            max-width: 650px;
            background-color: #E0E5EC;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2D3748;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.95rem;
            color: #4A5568;
            font-weight: 500;
        }

        .layout-column {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .box {
            background-color: #E0E5EC;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
        }

        .box-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2D3748;
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: #E0E5EC;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: inherit;
            font-size: 0.95rem;
            color: #2D3748;
            resize: vertical;
            box-shadow: inset 6px 6px 12px rgba(163, 177, 198, 0.6), inset -6px -6px 12px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            box-shadow: inset 8px 8px 14px rgba(163, 177, 198, 0.7), inset -8px -8px 14px rgba(255, 255, 255, 0.9);
        }

        textarea::placeholder {
            color: #A0AEC0;
        }

        .summarize-btn {
            width: 100%;
            background-color: #E0E5EC;
            border: none;
            border-radius: 16px;
            padding: 16px 24px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            color: #2D3748;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
            user-select: none;
        }

        .summarize-btn:hover {
            color: #3182CE;
            box-shadow: 11px 11px 18px rgba(163, 177, 198, 0.7), -11px -11px 18px rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        .summarize-btn:active {
            box-shadow: inset 6px 6px 12px rgba(163, 177, 198, 0.6), inset -6px -6px 12px rgba(255, 255, 255, 0.8);
            transform: translateY(1px);
        }

        .summarize-btn:disabled {
            color: #A0AEC0;
            cursor: not-allowed;
            box-shadow: inset 4px 4px 8px rgba(163, 177, 198, 0.5), inset -4px -4px 8px rgba(255, 255, 255, 0.7);
            transform: none;
        }

        .output-content {
            background-color: #E0E5EC;
            border-radius: 12px;
            padding: 18px;
            box-shadow: inset 6px 6px 12px rgba(163, 177, 198, 0.6), inset -6px -6px 12px rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            line-height: 1.6;
            color: #2D3748;
            min-height: 120px;
        }

        .placeholder-text {
            color: #A0AEC0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="header">
            <h1>Text Summarizer</h1>
            <p>Write or Paste your content below for quick summarization.</p>
        </div>

        <form id="summarization-form" class="layout-column">
            <!-- Top Input Box -->
            <div class="box">
                <div class="box-title">Source Content</div>
                <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            </div>

            <!-- Middle Summarize Button -->
            <button type="submit" id="submit-btn" class="summarize-btn">
                Summarize
            </button>

            <!-- Bottom Output Box -->
            <div class="box">
                <div class="box-title">Content Summary</div>
                <div class="output-content">
                    <p id="summary-text" class="placeholder-text">Your summary will appear here after clicking Summarize...</p>
                </div>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = document.getElementById("submit-btn");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.classList.remove("placeholder-text");
            summaryText.innerText = "Processing summary...";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
